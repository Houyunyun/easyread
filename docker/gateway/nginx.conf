worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 200m;
    ssl_certificate /auth/tls.crt;
    ssl_certificate_key /auth/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 8080 ssl;
        server_name _;
        error_page 497 =301 https://$http_host$request_uri;
        auth_basic "EasyRead";
        auth_basic_user_file /auth/htpasswd;
        location = /healthz { auth_basic off; access_log off; return 200 "ok\n"; }
        location / {
            proxy_pass http://easyread:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Remote-User "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1800s;
        }
    }
    # Separate origin: reader content must not inherit access to terminal WS.
    server {
        listen 8081 ssl;
        server_name _;
        error_page 497 =301 https://$http_host$request_uri;
        auth_basic "EasyRead Terminal";
        auth_basic_user_file /auth/htpasswd;
        set $terminal_origin $http_origin;
        if ($http_origin = "") { set $terminal_origin "https://$http_host"; }
        if ($terminal_origin != "https://$http_host") { return 403; }
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        location / {
            proxy_pass http://terminal:7681;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Remote-User "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }
    }
}
