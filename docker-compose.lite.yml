services:
  easyread:
    build:
      context: .
      target: lite
    image: easyread-lite:local
    init: true
    ports:
      - "127.0.0.1:${EASYREAD_PORT:-8765}:8765"
    environment:
      EASYREAD_HOME: /data/EasyRead
      EASYREAD_HOST: 0.0.0.0
      EASYREAD_PORT: "8765"
    volumes:
      - easyread-data:/data/EasyRead
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  easyread-data:
